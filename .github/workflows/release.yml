name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      working-directory: app
      run: npm ci

    - name: Run automated tests
      working-directory: app
      run: npm test

    - name: Restore MorphlyVC runtime
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $runtimeDir = "app/.meanvc/runtime-40ms"
        if (!(Test-Path "$runtimeDir/python.exe")) {
          Write-Host "Restoring MorphlyVC runtime from v2.5.0 release..."
          New-Item -ItemType Directory -Path "temp_v250" -Force | Out-Null
          gh release download v2.5.0 --repo "${{ github.repository }}" --pattern "Morphly-Setup-2.5.0.exe" --dir temp_v250
          Write-Host "Extracting MorphlyVC runtime from v2.5.0 installer..."
          7z x temp_v250/Morphly-Setup-2.5.0.exe -otemp_unpacked -y
          if (Test-Path "temp_unpacked/`$PLUGINSDIR/app-64.7z") {
            7z x "temp_unpacked/`$PLUGINSDIR/app-64.7z" -otemp_app -y
            $extractedRuntime = "temp_app/resources/morphlyvc/runtime-40ms"
          } else {
            $extractedRuntime = (Get-ChildItem -Path "temp_unpacked" -Filter "runtime-40ms" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if ($extractedRuntime -and (Test-Path "$extractedRuntime/python.exe")) {
            New-Item -ItemType Directory -Path "app/.meanvc" -Force | Out-Null
            Move-Item -Path $extractedRuntime -Destination $runtimeDir -Force
          }
          Remove-Item -Path "temp_v250", "temp_unpacked", "temp_app" -Recurse -Force -ErrorAction SilentlyContinue
        }

        if (!(Test-Path "$runtimeDir/python.exe")) {
          throw "Failed to restore MorphlyVC runtime: $runtimeDir/python.exe not found."
        }
        Write-Host "MorphlyVC runtime successfully restored."

    - name: Test bundled voice audio buffering without microphone access
      shell: pwsh
      run: |
        & ./app/.meanvc/runtime-40ms/python.exe ./app/tests/voice-buffer.test.py
        if ($LASTEXITCODE -ne 0) { throw "MorphlyVC audio regression tests failed." }

    - name: Build Electron app without publishing
      working-directory: app
      env:
        VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
      run: npm run electron:build

    - name: Resolve release version
      id: release-version
      working-directory: app
      shell: pwsh
      run: |
        $packageVersion = (Get-Content package.json | ConvertFrom-Json).version

        if ("${{ github.ref_type }}" -eq "tag") {
          $tagName = "${{ github.ref_name }}"
          $tagVersion = $tagName.TrimStart('v')

          if ($tagVersion -ne $packageVersion) {
            throw "Tag $tagName does not match app/package.json version $packageVersion. Update the app version before creating the tag."
          }

          $version = $tagVersion
        } else {
          $version = $packageVersion
          $tagName = "v$packageVersion"
        }

        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

    - name: Package optional MorphlyVC voice engine
      shell: pwsh
      run: |
        $runtimeDir = "app/.meanvc/runtime-40ms"
        if (!(Test-Path "$runtimeDir/python.exe")) {
          throw "MorphlyVC runtime is missing; cannot package the optional voice engine."
        }

        $assetPath = Join-Path (Get-Location) "app/release/morphlyvc-runtime-40ms.zip"
        if (Test-Path $assetPath) { Remove-Item $assetPath -Force }

        # 7-Zip handles the multi-gigabyte archive reliably. Entering the parent
        # directory keeps "runtime-40ms" as the archive root the app expects.
        Push-Location "app/.meanvc"
        try {
          7z a -tzip -mx5 -bso0 $assetPath "runtime-40ms"
          if ($LASTEXITCODE -ne 0) { throw "Failed to package the MorphlyVC voice engine." }
        } finally {
          Pop-Location
        }

        # GitHub requires every asset to be strictly smaller than 2 GiB.
        # Publish 1 GiB parts and a manifest; Morphly rejoins them automatically.
        node app/scripts/split-voice-engine.mjs $assetPath
        if ($LASTEXITCODE -ne 0) { throw "Failed to split the MorphlyVC voice engine." }

    - name: Verify release artifacts
      shell: pwsh
      run: |
        $version = "${{ steps.release-version.outputs.VERSION }}"
        $dir = "app/release"

        if (!(Test-Path $dir)) { throw "Missing output directory: $dir" }

        $installerCandidates = @(
          (Join-Path $dir "Morphly-Setup-$version.exe"),
          (Join-Path $dir "Morphly Setup $version.exe")
        )
        $exe1 = $installerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

        if (!$exe1) { throw "Missing installer. Checked: $($installerCandidates -join ', ')" }
        $maxReleaseAssetBytes = 2GB
        if ((Get-Item $exe1).Length -ge $maxReleaseAssetBytes) {
          throw "Installer exceeds GitHub's 2 GiB release-asset limit: $exe1"
        }

        $bundledCameraDir = Join-Path $dir "win-unpacked/resources/unity-capture"
        if (!(Test-Path $bundledCameraDir)) { throw "Missing bundled camera directory: $bundledCameraDir" }
        $bundledMediaFoundationCameraDir = Join-Path $dir "win-unpacked/resources/media-foundation-camera"
        if (!(Test-Path $bundledMediaFoundationCameraDir)) {
          throw "Missing bundled Media Foundation camera directory: $bundledMediaFoundationCameraDir"
        }

        $appAsar = Join-Path $dir "win-unpacked/resources/app.asar"
        if (!(Test-Path $appAsar)) { throw "Missing packaged app archive: $appAsar" }
        $asarCli = Join-Path $PWD "app/node_modules/.bin/asar.cmd"
        if (!(Test-Path $asarCli)) { throw "Missing ASAR inspection CLI: $asarCli" }
        $asarEntries = @(& $asarCli list $appAsar)
        if ($LASTEXITCODE -ne 0) { throw "Unable to inspect packaged app archive: $appAsar" }
        foreach ($requiredEntry in @('\shared\load-environment.js')) {
          if ($asarEntries -notcontains $requiredEntry) {
            throw "Packaged app archive is missing required runtime module: $requiredEntry"
          }
        }
        if (Select-String -Path $appAsar -Pattern "FLWPUBK(?:_TEST)?-[A-Za-z0-9_-]+-X" -Quiet) {
          throw "Packaged app archive contains a baked Flutterwave public key. Payment keys must be loaded from runtime config."
        }
        if (Test-Path (Join-Path $dir "win-unpacked/resources/.env")) {
          throw "Packaged app contains resources/.env. Server credentials must not be bundled into desktop releases."
        }

        $expectedArtifacts = @(
          "UnityCaptureFilter32.dll",
          "UnityCaptureFilter64.dll",
          "morphly_unity_capture_sender.exe",
          "THIRD_PARTY_NOTICES.txt"
        )

        foreach ($artifact in $expectedArtifacts) {
          $artifactPath = Join-Path $bundledCameraDir $artifact
          if (!(Test-Path $artifactPath)) { throw "Missing bundled camera artifact: $artifactPath" }
        }

        foreach ($artifact in @("MorphlyVirtualCameraMF.dll", "morphly_cam_registrar.exe")) {
          $artifactPath = Join-Path $bundledMediaFoundationCameraDir $artifact
          if (!(Test-Path $artifactPath)) { throw "Missing bundled Media Foundation camera artifact: $artifactPath" }
        }

        # The voice engine is now an optional on-demand download, so only the
        # Python bridge ships inside the installer.
        $bundledVoiceBridge = Join-Path $dir "win-unpacked/resources/morphlyvc/meanvc-realtime.py"
        if (!(Test-Path $bundledVoiceBridge)) { throw "Missing bundled MorphlyVC bridge: $bundledVoiceBridge" }

        if (Test-Path (Join-Path $dir "win-unpacked/resources/morphlyvc/runtime-40ms")) {
          throw "The optional voice engine must not be bundled in the desktop installer."
        }
        $voiceEngineManifest = Join-Path $dir "morphlyvc-runtime-40ms.zip.json"
        $manifest = Get-Content $voiceEngineManifest -Raw | ConvertFrom-Json
        if ($manifest.format -ne 1 -or $manifest.parts.Count -lt 1) { throw "Invalid voice engine manifest." }
        foreach ($part in $manifest.parts) {
          $partPath = Join-Path $dir $part.name
          $partSize = (Get-Item $partPath).Length
          if ($partSize -ne $part.size -or $partSize -ge $maxReleaseAssetBytes) {
            throw "Invalid release asset size: $partPath"
          }
          if ((Get-FileHash $partPath -Algorithm SHA256).Hash.ToLower() -ne $part.sha256) {
            throw "Voice engine checksum mismatch: $partPath"
          }
        }

    - name: Publish verified release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.release-version.outputs.VERSION }}"
        $tagName = "${{ steps.release-version.outputs.TAG_NAME }}"
        $installer = "app/release/Morphly-Setup-$version.exe"
        $latest = "app/release/latest.yml"
        $blockmaps = @(Get-ChildItem -Path "app/release" -Filter "*.blockmap" | ForEach-Object { $_.FullName })
        $voiceEngineManifest = "app/release/morphlyvc-runtime-40ms.zip.json"
        $manifest = Get-Content $voiceEngineManifest -Raw | ConvertFrom-Json
        $voiceEngineParts = @($manifest.parts | ForEach-Object { (Resolve-Path (Join-Path "app/release" $_.name)).Path })
        $assets = @(
          (Resolve-Path $installer).Path,
          (Resolve-Path $latest).Path,
          (Resolve-Path $voiceEngineManifest).Path
        ) + $blockmaps + $voiceEngineParts
        foreach ($asset in $assets) {
          if ((Get-Item $asset).Length -ge 2GB) { throw "Release asset must be smaller than 2 GiB: $asset" }
        }

        $existing = gh release view $tagName --repo "${{ github.repository }}" --json isDraft 2>$null
        if ($LASTEXITCODE -eq 0) {
          if (!(($existing | ConvertFrom-Json).isDraft)) {
            throw "Release $tagName is already published. Create a new version instead of replacing live update files."
          }
        } else {
          gh release create $tagName --draft --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Morphly Desktop $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Creating draft release $tagName failed." }
        }

        gh release upload $tagName $assets --clobber --repo "${{ github.repository }}"
        if ($LASTEXITCODE -ne 0) { throw "Uploading release $tagName failed; it remains a draft." }
        gh release edit $tagName --draft=false --latest --repo "${{ github.repository }}"
        if ($LASTEXITCODE -ne 0) {
          throw "Publishing verified release $tagName failed."
        }
