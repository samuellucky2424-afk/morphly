name: Assemble release installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the installer chunks
        required: true
        default: v2.5.0
      installer:
        description: Final installer asset name
        required: true
        default: Morphly-Setup-2.5.0.exe
      sha256:
        description: Expected SHA-256 of the assembled installer
        required: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer chunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          INSTALLER: ${{ inputs.installer }}
        run: |
          mkdir -p parts
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$INSTALLER.part-*" \
            --dir parts
          test -n "$(find parts -maxdepth 1 -type f -name "$INSTALLER.part-*" -print -quit)"

      - name: Assemble and verify installer
        env:
          INSTALLER: ${{ inputs.installer }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          cat parts/"$INSTALLER".part-* > "$INSTALLER"
          echo "$EXPECTED_SHA256  $INSTALLER" | sha256sum --check --strict

      - name: Publish complete installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          INSTALLER: ${{ inputs.installer }}
        run: |
          gh release upload "$TAG" "$INSTALLER" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Remove temporary chunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          INSTALLER: ${{ inputs.installer }}
        run: |
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name | startswith(\"$INSTALLER.part-\")) | .id" |
          while read -r asset_id; do
            test -z "$asset_id" || gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
