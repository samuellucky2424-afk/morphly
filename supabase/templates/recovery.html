<!doctype html>
<html lang="en">
  <body style="font-family:Arial,sans-serif;color:#202020;line-height:1.6">
    <h1>Reset your Morphly password</h1>
    <p>Enter this one-time code on the reset password screen in Morphly or your browser:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p>This code expires shortly and can only be used once. Never share it with anyone.</p>
    <p>If you did not request a password reset, you can ignore this email.</p>
  </body>
</html>
