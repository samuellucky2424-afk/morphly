<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Morphly password</title>
  <link rel="stylesheet" href="/private/morphly/login/styles.css">
  <script src="/private/morphly/login/supabase.js"></script>
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;background:#f7f8fa;padding:24px">
    <form id="resetForm" class="panel" style="width:min(420px,100%);padding:32px">
      <p class="eyebrow">Account recovery</p><h1>Choose a new password</h1>
      <p style="color:#667085;margin:8px 0 24px">Use at least eight characters.</p>
      <label class="form-field"><span>New password</span><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="form-field"><span>Confirm password</span><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
      <p id="resetMessage" role="alert" style="min-height:22px"></p>
      <button class="primary-button" style="width:100%" type="submit">Update password</button>
    </form>
  </main>
  <script>
    (async () => {
      const message = document.querySelector('#resetMessage');
      try {
        const config = await fetch('/api/public-config').then((response) => response.json());
        const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError || !sessionData.session) throw new Error('This reset link is invalid or has expired. Request a new password reset email.');
        document.querySelector('#resetForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.querySelector('#newPassword').value;
          if (password !== document.querySelector('#confirmPassword').value) { message.textContent = 'Passwords do not match.'; return; }
          message.textContent = 'Updating password…';
          const { error } = await client.auth.updateUser({ password });
          if (error) { message.textContent = error.message; return; }
          await client.auth.signOut({ scope: 'local' });
          message.textContent = 'Password updated. You can close this page and sign in to Morphly.';
          document.querySelector('#resetForm button').disabled = true;
        });
      } catch (error) { message.textContent = error.message || 'Unable to open this reset link.'; }
    })();
  </script>
</body>
</html>
