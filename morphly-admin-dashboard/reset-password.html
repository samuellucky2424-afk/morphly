<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset Morphly password</title>
  <link rel="stylesheet" href="/private/morphly/login/styles.css">
  <style>
    .recovery-page { min-height:100dvh; display:grid; place-items:center; background:var(--bg); padding:24px; }
    .recovery-card { width:min(420px,100%); padding:28px; }
    .recovery-card fieldset { border:0; padding:0; margin:0; min-width:0; }
    .recovery-card input { width:100%; min-height:44px; font-size:16px; }
    .recovery-card button { width:100%; min-height:44px; }
    .recovery-card button:disabled { opacity:.5; cursor:not-allowed; }
    .recovery-card :focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
    .recovery-message { margin:16px 0; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
    .recovery-message[data-error="true"] { color:var(--danger); border-color:var(--danger); }
    .recovery-links { display:grid; gap:12px; margin-top:20px; font-size:14px; }
    .recovery-links a { color:var(--brand); text-decoration:underline; }
  </style>
  <script defer src="/private/morphly/login/supabase.js"></script>
  <script type="module" src="/reset-password/reset-password.js"></script>
</head>
<body>
  <main class="recovery-page">
    <form id="resetForm" class="panel recovery-card" method="post">
      <p class="eyebrow">Account recovery</p><h1>Choose a new password</h1>
      <p style="color:var(--muted);margin:8px 0 20px">Use at least eight characters. Your existing Morphly account and credits stay the same.</p>
      <p id="resetMessage" class="recovery-message" role="status" tabindex="-1">Checking your reset link…</p>
      <fieldset id="passwordFields" disabled>
        <label class="form-field" for="newPassword"><span>New password</span><input id="newPassword" type="password" minlength="8" autocomplete="new-password" aria-describedby="resetMessage" required></label>
        <label class="form-field" for="confirmPassword"><span>Confirm password</span><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" aria-describedby="resetMessage" required></label>
        <button class="primary-button" id="updatePassword" type="submit">Update password</button>
      </fieldset>
      <div class="recovery-links">
        <a id="requestReset" href="/#/login?reset=1">Request a new reset link</a>
        <a id="backToSignIn" href="/#/login">Back to sign in</a>
        <a href="https://live.morphly.fun">Morphly website</a>
      </div>
      <noscript>Enable JavaScript to verify your recovery link and update your password.</noscript>
    </form>
  </main>
</body>
</html>
